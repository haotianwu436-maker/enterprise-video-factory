[project]
name = "video-factory-contracts"
version = "0.1.0"
description = "Contract validation and runtime foundation for the enterprise talking-head video factory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "jsonschema>=4.23.0",
  "PyYAML>=6.0.2",
  "pytest>=8.2.0",
  "uvicorn[standard]>=0.48.0",
]

[project.scripts]
validate-contracts = "video_factory_contracts.cli:main"
video-factory-api = "video_factory_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_factory_contracts", "src/video_factory_runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
