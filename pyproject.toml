[project]
name = "video-factory-contracts"
version = "0.1.0"
description = "Contract validation tooling for the enterprise talking-head video factory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23.0",
  "PyYAML>=6.0.2",
  "pytest>=8.2.0",
]

[project.scripts]
validate-contracts = "video_factory_contracts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
